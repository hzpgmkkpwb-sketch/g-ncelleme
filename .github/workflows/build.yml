name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları ve Java Ortamını Kur
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          build-essential ccache libstdc++6 zlib1g-dev libncurses5 ant

    - name: Buildozer ve Cython Kurulumu
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer requests

    - name: Android SDK ve NDK Önbellekleme (Derlemeyi Hızlandırır)
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Buildozer ile APK Derle
      run: |
        export PACKAGES_PATH=~/.buildozer
        buildozer -v android debug
        
    - name: Derlenen APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
